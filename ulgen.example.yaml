# ulgen configuration example.
listen: ":8080"
path: /mcp
# a 401's WWW-Authenticate names it (RFC 9728): where MCP clients find the authorization server
resource_metadata: https://api.example.com/.well-known/oauth-protected-resource/mcp
# HTTPS, for callers' tokens crossing a network. The files are re-read when
# they change: a renewed certificate needs no restart.
# tls: {cert_file: /etc/ulgen/tls/cert.pem, key_file: /etc/ulgen/tls/key.pem}

kayra:
  url: https://kayra.example.com       # userinfo, /check, the caller's namespaces
  cache_ttl: 1m                        # caller resolution cache (/check is never cached)

vault:                                 # namespace credentials (KV v2), AppRole login
  address: https://vault.example.com:8200
  role_id_env: ULGEN_VAULT_ROLE_ID
  secret_id_file: /run/secrets/ulgen-vault-secret-id

tools_ttl: 5m                          # upstream tools are listed again after this
credential_ttl: 1m                     # a credential read from Vault is kept this long

upstreams:
  # mcp-grafana: no notion of namespace; one Grafana service account per namespace's
  # org, its token in Vault. ulgen asks Kayra /check before each call.
  - name: grafana
    url: http://mcp-grafana:8000/mcp
    api: mcp.infrapi.io                # Kayra api whose OpenAPI document ulgen serves (its resources: the rules')
    authorize: ulgen
    credential:
      vault: {mount: secret, path: "mcp-gateway/grafana/{namespace}", key: token}
      header: X-Grafana-Service-Account-Token
    namespace: {inject: true}
    # the tools exposed, first match wins: a regular expression on the whole tool name, or a rule
    # with the resource of `api` its calls are checked on (none: every tool, resource "tools")
    allowed_tools:
      - {match: "query_prometheus.*|list_prometheus_.*", resource: prometheus}
      - {match: "query_loki.*|list_loki_.*", resource: loki}
      - {match: "search_dashboards|get_dashboard.*", resource: dashboards}
    headers_from_env:
      Authorization: MCP_GRAFANA_CALLER_AUTH   # "Bearer <mcp-grafana --server-auth-token>"
    # Or no api of its own: borrow an existing api's right, one for every call
    # (read-only tools only, no spec served, nothing to register):
    #   api: telemetry.infrapi.io
    #   check: {resource: dashboards, verb: list}

  # An infrapi/lib MCP: it checks every call itself with the caller's token.
  - name: telemetry
    url: https://api.example.com/apis/telemetry.infrapi.io/v1/-/mcp
    api: telemetry.infrapi.io
    authorize: upstream
    credential: {passthrough: true}
    namespace: {argument: namespace}
    namespace_check: {resource: dashboards, verb: list}   # list_namespaces: where it is usable
